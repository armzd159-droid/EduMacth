<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ลืมรหัสผ่าน - Edu Match</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="login-page-body"> <header class="main-header">
        <nav class="navbar">
            <a href="login.html" class="back-button" aria-label="Go back">
                &larr; กลับไปหน้าล็อกอิน
            </a>
            <div class="logo-center">Edu Match</div>
            <div></div>
        </nav>
    </header>

    <main class="login-container">
        <h1 class="login-title">ลืมรหัสผ่าน</h1>
        <p class="section-description" style="text-align: center; margin-top: -20px; margin-bottom: 20px;">
            กรอกอีเมลของคุณเพื่อรับลิงก์รีเซ็ตรหัสผ่าน
        </p>

        <form class="login-form" id="forgot-password-form">
            <div class="form-group">
                <label for="email">อีเมล</label>
                <input type="email" id="email" name="email" placeholder="กรอกอีเมลที่ลงทะเบียนไว้" required>
            </div>
            
            <button type="submit" class="button primary login-button">ส่งลิงก์รีเซ็ตรหัสผ่าน</button>
        </form>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const form = document.getElementById('forgot-password-form');
            const emailInput = document.getElementById('email');

            form.addEventListener('submit', (e) => {
                e.preventDefault(); // ป้องกันการโหลดหน้าใหม่
                
                const email = emailInput.value;
                if (email.trim() === '') {
                    alert('กรุณากรอกอีเมลของคุณ');
                    return;
                }

                // --- นี่คือ "การจำลอง" ครับ ---
                alert(`(จำลองการทำงานของ Backend)\n\nระบบได้ส่งลิงก์รีเซ็ตรหัสผ่านไปที่: \n${email}\n\nกรุณาตรวจสอบอีเมลของคุณ`);

                // ส่งผู้ใช้กลับไปหน้าล็อกอิน
                window.location.href = 'login.html';
            });
        });
    </script>
</body>
</html>
