<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เข้าสู่ระบบ - Edu Match</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="login-page-body">
    <header class="main-header">
        <nav class="navbar">
            <a href="index.html" class="back-button" aria-label="Go back">
                &larr; กลับ
            </a>
            <div class="logo-center">Edu Match</div>
            <div class="lang-switcher">
                <button id="lang-switcher-th" class="lang-btn active">TH</button>
                <button id="lang-switcher-en" class="lang-btn">EN</button>
            </div>
            <div></div> </nav>
    </header>

    <main class="login-container">
        <h1 class="login-title">เข้าสู่ระบบ</h1>
        <form class="login-form">
            <div class="form-group">
                <label for="username">ชื่อผู้ใช้ / อีเมล</label>
                <input type="text" id="username" name="username" placeholder="กรอกชื่อผู้ใช้หรืออีเมล" required>
            </div>
            <div class="form-group">
                <label for="password">รหัสผ่าน</label>
                <input type="password" id="password" name="password" placeholder="กรอกรหัสผ่าน" required>
            </div>
            <button type="submit" class="button primary login-button">เข้าสู่ระบบ</button>
            <div class="register-section">
                <p>ยังไม่มีบัญชีใช่ไหม?</p>
                <a href="register.html" class="button secondary register-button">สมัครสมาชิก</a>
            </div>
            <a href="forgot-password.html" class="forgot-password">ลืมรหัสผ่าน?</a>
        </form>
    </main>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const loginForm = document.querySelector('.login-form');
            const usernameInput = document.getElementById('username');

            if (loginForm && usernameInput) {
                loginForm.addEventListener('submit', (e) => {
                    // "กันบัค": ป้องกันการส่งฟอร์มจริง
                    e.preventDefault(); 
                    
                    // ดึงชื่อผู้ใช้ (หรืออีเมล) จากฟอร์ม
                    const username = usernameInput.value;

                    // "กันบัค": เช็กว่ากรอกข้อมูลมา
                    if (username.trim() === '') {
                        alert('กรุณากรอกชื่อผู้ใช้หรืออีเมล');
                        return;
                    }

                    // *** นี่คือการจำลองการล็อกอิน ***
                    // เราบันทึกชื่อลง localStorage
                    localStorage.setItem('loggedInUser', username);

                    // ส่งผู้ใช้กลับไปหน้าหลัก
                    alert('เข้าสู่ระบบสำเร็จ! ยินดีต้อนรับ, ' + username);
                    window.location.href = 'index.html';
                });
            }
        });
    </script>
    </body>
</html>
</body>
</html>
